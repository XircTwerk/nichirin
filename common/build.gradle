architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/nichirin.accesswidener")
}

sourceSets {
    main {
        resources {
            srcDirs("src/main/generated")
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    compileOnly "mod.azure.azurelib:azurelib-common-1.21.1:${azurelib_version}"

    modApi "com.zigythebird.playeranim:PlayerAnimationLibCommon:${rootProject.pal_version}"
    modCompileOnly "com.zigythebird.playeranim:PlayerAnimationLibCore:${rootProject.pal_version}"

    // Cloth Config — compile against the fabric jar (same API surface on both platforms)
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
}

shadowJar {
    enabled = false
}

def playerAnimationFiles = fileTree("src/main/resources/assets/nichirin/player_animations") {
    include "**/*.json"
}

tasks.register("validatePlayerAnimationIds") {
    inputs.files(playerAnimationFiles)
    doLast {
        playerAnimationFiles.each { animationFile ->
            def root = new groovy.json.JsonSlurper().parse(animationFile)
            root.animations?.keySet()?.each { animationId ->
                if (!(animationId ==~ /[a-z0-9\/._-]+/)) {
                    throw new GradleException("Invalid player animation id '${animationId}' in ${animationFile}: Minecraft resource IDs must be lowercase")
                }
            }
        }
    }
}

// Add duplicate handling to all jar tasks
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    dependsOn tasks.named("validatePlayerAnimationIds")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
