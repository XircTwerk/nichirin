plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners.set(true)
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "nichirin.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    implementation "mod.azure.azurelib:azurelib-forge-1.20.1:1.0.34"

    // Use implementation with files() to bypass module system entirely
    implementation files(project(':common').sourceSets.main.output.classesDirs)
    implementation files(project(':common').sourceSets.main.output.resourcesDir)
}

// Make sure common is built before forge compiles
compileJava.dependsOn(':common:classes')
processResources.dependsOn(':common:processResources')

// Ensure classes are copied to the right location for the mod loader
task copyCommonClasses(type: Copy) {
    from project(':common').sourceSets.main.output.classesDirs
    into sourceSets.main.output.classesDirs.singleFile
    dependsOn ':common:classes'
}

task copyCommonResources(type: Copy) {
    from project(':common').sourceSets.main.output.resourcesDir
    into sourceSets.main.output.resourcesDir
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    dependsOn ':common:processResources'
}

classes.dependsOn copyCommonClasses, copyCommonResources

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

sourcesJar {
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    enabled = false
}

remapJar {
    dependsOn jar
    archiveClassifier = null
}