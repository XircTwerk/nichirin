plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners.set(true)
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "nichirin.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}"
    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    modImplementation "mod.azure.azurelib:azurelib-neo-1.20.1:${azurelib_version}"

    // AzureLib Neo bundles mixinextras-forge-0.4.1 via JarInJar, but the loom dev environment
    // doesn't unpack JarInJar nested JARs (logs: "No dependencies to load found").
    // Add it explicitly so the mixin preprocessor can resolve @WrapOperation's Operation class.
    implementation "io.github.llamalad7:mixinextras-forge:0.4.1"

    // Use implementation with files() to bypass module system entirely
    implementation files(project(':common').sourceSets.main.output.classesDirs)
    implementation files(project(':common').sourceSets.main.output.resourcesDir)
}

// Make sure common is built before forge compiles
compileJava.dependsOn(':common:classes')
processResources.dependsOn(':common:processResources')

// Ensure classes are copied to the right location for the mod loader
task copyCommonClasses(type: Copy) {
    from project(':common').sourceSets.main.output.classesDirs
    into sourceSets.main.output.classesDirs.singleFile
    dependsOn ':common:classes'
}

task copyCommonResources(type: Copy) {
    from project(':common').sourceSets.main.output.resourcesDir
    into sourceSets.main.output.resourcesDir
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    dependsOn ':common:processResources'
}

classes.dependsOn copyCommonClasses, copyCommonResources

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

remapSourcesJar {
    dependsOn ':common:processResources'
    dependsOn sourcesJar
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    enabled = false
}

remapJar {
    dependsOn jar
    archiveClassifier = null
}

// ── AzureLib Forge Compatibility Patch ──────────────────────────────────────
// AzureLib Neo 3.x ships a mods.toml claiming Forge support, but its main
// class (NeoForgeAzureLibMod) uses NeoForge constructor injection that Forge
// FML cannot satisfy (FMLModContainer calls getDeclaredConstructor() with
// no arguments). We compile a shim with a no-arg constructor into a SEPARATE
// output directory (not the main module output) to avoid the JPMS split-package
// error ("Modules nichirin and azurelib export package mod.azure.azurelib"),
// then patch the loom-remapped AzureLib JAR with the shim class.

// Step 1: Compile the shim into an isolated output directory.
tasks.register('compileAzurelibShim', JavaCompile) {
    source = fileTree('src/azurelibShim/java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('azurelib-shim-classes')
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.release = 17
    dependsOn 'compileJava'
}

// Step 2: Patch the remapped AzureLib JAR using the isolated shim class.
tasks.register('patchAzureLibForForgeCompat') {
    dependsOn 'compileAzurelibShim'

    doLast {
        def azurelibVersion = rootProject.azurelib_version
        def modsDir = new File(rootProject.projectDir, ".gradle/loom-cache/remapped_mods")

        def jarFile = fileTree(modsDir).matching {
            include "**/azurelib-neo-1.20.1-${azurelibVersion}.jar"
        }.files.find()

        if (jarFile == null) {
            logger.warn("Remapped AzureLib JAR not found in ${modsDir} — run a Gradle sync first")
            return
        }

        def shimClassFile = layout.buildDirectory.file("azurelib-shim-classes/mod/azure/azurelib/NeoForgeAzureLibMod.class").get().asFile
        if (!shimClassFile.exists()) {
            throw new GradleException("Shim class not compiled: ${shimClassFile}")
        }

        def shimBytes = shimClassFile.bytes
        def tempFile = new File(temporaryDir, "azurelib-patched.jar")
        tempFile.parentFile.mkdirs()

        boolean patched = false
        new java.util.zip.ZipFile(jarFile).withCloseable { zipIn ->
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tempFile)).withCloseable { zipOut ->
                for (entry in zipIn.entries()) {
                    zipOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (entry.name == "mod/azure/azurelib/NeoForgeAzureLibMod.class") {
                        zipOut.write(shimBytes)
                        patched = true
                    } else if (!entry.directory) {
                        zipOut.write(zipIn.getInputStream(entry).bytes)
                    }
                    zipOut.closeEntry()
                }
            }
        }

        if (!patched) {
            logger.warn("NeoForgeAzureLibMod.class not found in AzureLib JAR — already patched or structure changed")
            tempFile.delete()
            return
        }

        // On Windows, Files.move(REPLACE_EXISTING) fails if the file is held open
        // by IntelliJ. Write via FileOutputStream instead (works with read-share locks).
        jarFile.withOutputStream { out ->
            out.write(tempFile.bytes)
        }
        tempFile.delete()
        logger.lifecycle("Patched AzureLib JAR for Forge 1.20.1 compatibility (NeoForgeAzureLibMod no-arg constructor)")
    }
}

tasks.named('runClient').configure { dependsOn 'patchAzureLibForForgeCompat' }
tasks.named('runServer').configure { dependsOn 'patchAzureLibForForgeCompat' }