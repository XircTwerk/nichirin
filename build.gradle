plugins {
    id 'dev.architectury.loom' version '1.9.436' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.11' apply false
    id 'maven-publish'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    apply plugin: "architectury-plugin"

    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.gradleup.shadow'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.azuredoom.com/mods' }
        maven { url 'https://repo.redlance.org/public' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url = "https://maven.parchmentmc.org" }
        maven { url "https://maven.shedaniel.me/" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
        maven {
            url "https://cursemaven.com"
        }
        maven {
            url = "https://maven.minecraftforge.net/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_mappings}@zip")
        }
        compileOnly "com.google.guava:guava:33.6.0-jre"
        runtimeOnly "org.joml:joml:1.10.9"

        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
        it.options.warnings = false
        it.options.compilerArgs.addAll(['-Xlint:-deprecation', '-Xlint:-removal'])
    }

    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
        it.zip64 = true
    }
}
